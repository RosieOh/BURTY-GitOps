# sidecar 가 들고 있는 xDS 설정 범위를 좁힌다.
# 기본값은 "메시 전체의 모든 서비스"라 클러스터가 커질수록 envoy 메모리와 설정 전파
# 지연이 같이 늘어난다. 이 앱은 자기 네임스페이스 + istio-system + 관측 스택이면 충분하다.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
spec:
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
        - "observability/*"
  outboundTrafficPolicy:
    mode: ALLOW_ANY
