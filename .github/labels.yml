# scripts/gh-bootstrap.sh 가 이 파일을 읽어 라벨을 생성한다.
# 타입 라벨은 앱 레포의 커밋 컨벤션(FEAT/FIX/REFACTOR/CHORE + gitmoji)과 맞춘다.

- name: "type:feat"
  color: "0E8A16"
  description: "✨ 기능 추가"
- name: "type:fix"
  color: "D73A4A"
  description: "🐛 버그 수정"
- name: "type:refactor"
  color: "6F42C1"
  description: "♻️ 구조 개선"
- name: "type:chore"
  color: "586069"
  description: "🔧 빌드·설정·문서·운영"

