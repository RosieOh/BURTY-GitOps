apiVersion: apps/v1
kind: Deployment
metadata:
  name: burty-api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: burty-api
          # dev 는 태그가 자주 바뀐다 — 같은 태그 재푸시를 반영하려면 Always 가 안전하다.
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              memory: 1Gi
          # dev 는 in-cluster MariaDB 가 뜨는 데 시간이 걸린다 — 기동 대기를 넉넉히.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 60
