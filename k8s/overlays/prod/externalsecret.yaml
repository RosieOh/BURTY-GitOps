# prod Secret 을 AWS Secrets Manager 에서 자동 반입한다.
# 이걸 쓰면 `kubectl create secret --from-env-file` 부트스트랩이 사라지고,
# 시크릿 로테이션이 클러스터에 자동 반영된다(refreshInterval).
#
# 전제: External Secrets Operator 설치
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace
#
# ESO 를 쓰지 않는다면 이 파일을 kustomization 에서 빼고 SealedSecrets 또는 수동 생성으로 간다.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: burty-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            # IRSA 로 secretsmanager:GetSecretValue 권한을 받은 SA.
            name: burty-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: burty-external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE:role/burty-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: burty-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: burty-aws-secrets
    kind: SecretStore
  target:
    name: burty-secret
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    # Secrets Manager 에 JSON 한 덩어리로 넣어 두고 통째로 편다.
    # 키 이름은 base/secret.example.yaml 의 stringData 키와 정확히 같아야 한다.
    - extract:
        key: burty/prod/app
