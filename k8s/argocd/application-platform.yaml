# cert-manager ClusterIssuer + Gateway TLS 인증서.
# 앱보다 먼저 존재해야 하므로 별도 Application 으로 분리했다(sync-wave 로 순서 보장).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: burty-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: burty-platform
  source:
    repoURL: https://github.com/RosieOh/BURTY-GitOps.git
    targetRevision: main
    path: k8s/platform
  destination:
    server: https://kubernetes.default.svc
    # 각 리소스가 자기 네임스페이스를 명시한다(kustomize namespace 트랜스포머 미사용).
    # 이 값은 네임스페이스가 없는 리소스의 기본값으로만 쓰인다.
    namespace: istio-system
  syncPolicy:
    automated:
      prune: false      # 인증서를 실수로 지우면 전 서비스가 TLS 실패한다. prune 금지.
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /spec/duration
        - /spec/renewBefore
