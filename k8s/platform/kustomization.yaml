apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠️ 의도적으로 `namespace:` 를 두지 않는다.
#    Certificate 는 istio-system 에 있어야 하고(게이트웨이가 그 네임스페이스에서 Secret 을 찾는다),
#    kustomize 의 namespace 트랜스포머는 리소스에 명시된 네임스페이스를 덮어써 버린다.
resources:
  - clusterissuer.yaml
  - certificates.yaml
  - platform-ingress.yaml
  - jenkins.yaml
