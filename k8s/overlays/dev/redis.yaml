# dev 전용 in-cluster Redis. 앱은 Streams(큐) + 캐시로 쓴다.
apiVersion: v1
kind: Service
metadata:
  name: burty-redis
  labels:
    app.kubernetes.io/name: burty-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: burty-redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: burty-redis
spec:
  serviceName: burty-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burty-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burty-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            # Streams 의 미확인 메시지가 유실되면 아웃박스 재처리가 꼬인다 → AOF 켠다.
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction
          ports:
            - name: tcp-redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: burty-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
