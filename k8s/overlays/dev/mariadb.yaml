# dev 전용 in-cluster MariaDB. prod 는 RDS 를 쓴다(overlays/prod/external-datastores.yaml).
# 백업 없음 — 날아가도 되는 데이터만 둘 것.
apiVersion: v1
kind: Service
metadata:
  name: burty-mariadb
  labels:
    app.kubernetes.io/name: burty-mariadb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: burty-mariadb
  ports:
    # Istio 는 포트 이름으로 프로토콜을 정한다. tcp- prefix 가 없으면 HTTP 로 오인해
    # MySQL 핸드셰이크가 깨진다. 이름을 바꾸지 말 것.
    - name: tcp-mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: burty-mariadb
spec:
  serviceName: burty-mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burty-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burty-mariadb
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mariadb
          image: mariadb:11
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --max-connections=200
          ports:
            - name: tcp-mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: burty-secret
                  key: DB_PASSWORD
            - name: MARIADB_DATABASE
              value: burty
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: burty-secret
                  key: DB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: burty-secret
                  key: DB_PASSWORD
            - name: TZ
              value: Asia/Seoul
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
