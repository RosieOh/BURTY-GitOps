apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - podmonitor.yaml
  - prometheusrule.yaml

# 기존 infra/observability/grafana/dashboards/*.json 을 그대로 옮겨왔다.
# kube-prometheus-stack 의 Grafana sidecar 가 label 로 대시보드를 자동 로드한다.
# (kustomize 는 base 디렉터리 밖 파일을 참조하지 못하므로 원본을 복사해 둔 것 — 원본 수정 시 동기화 필요)
configMapGenerator:
  - name: burty-grafana-dashboards
    files:
      - dashboards/burty-overview.json
      - dashboards/burty-logs.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        # sidecar 가 이 폴더 아래에 배치한다
        k8s-sidecar-target-directory: /tmp/dashboards/burty

generatorOptions:
  disableNameSuffixHash: true
