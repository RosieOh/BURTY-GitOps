# Jenkins 를 클러스터 안으로. 기존 EC2 Jenkins(8081)를 대체한다.
#
# Helm 차트가 Jenkins 본체와 자체 RBAC 을 만든다(values/jenkins-values.yaml).
# 여기 있는 건 차트가 만들어 주지 않는, 파이프라인이 실제로 필요로 하는 부속들이다.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
  labels:
    kubernetes.io/metadata.name: jenkins
    # Jenkins 자체는 메시에 넣지 않는다. 에이전트 파드가 Job 으로 뜨고 죽는데
    # 사이드카가 붙으면 Job 이 Complete 로 넘어가지 못한다.
    istio-injection: disabled
---
# Gradle 의존성 캐시. 없으면 빌드마다 전체 의존성을 다시 받아 5분씩 더 걸린다.
# 에이전트가 여러 개 동시에 뜨면 RWX 가 필요하다(RWO 면 동시 빌드가 Pending 된다).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-gradle-cache
  namespace: jenkins
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc   # REPLACE — RWX StorageClass
  resources:
    requests:
      storage: 20Gi
---
# 파이프라인이 burty-* 네임스페이스를 들여다보기 위한 최소 권한.
# Jenkinsfile 의 post{failure} 에서 kubectl get pods / logs 를 쓴다.
# 배포 권한은 주지 않는다 — 배포는 ArgoCD 만 한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-readonly
  namespace: burty-prod
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-readonly
  namespace: burty-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-readonly
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-readonly
  namespace: burty-dev
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-readonly
  namespace: burty-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-readonly
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
