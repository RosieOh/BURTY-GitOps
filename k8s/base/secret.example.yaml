# ⚠️ 이 파일은 "예시"다. 실제 값이 든 Secret 을 Git 에 올리지 말 것.
#
# 운영 반입 경로는 셋 중 하나를 고른다:
#   1) SealedSecrets : kubeseal < secret.yaml > sealed-secret.yaml  → 암호문만 커밋
#   2) External Secrets Operator : AWS Secrets Manager / Vault 참조 (권장)
#   3) 부트스트랩 수동 생성 :
#      kubectl -n burty-prod create secret generic burty-secret --from-env-file=.env.prod
#
# ArgoCD 가 Secret 을 관리하지 않게 하려면 overlay 의 kustomization 에서 이 리소스를 빼고
# `ignoreDifferences` 또는 `argocd.argoproj.io/compare-options: IgnoreExtraneous` 를 쓴다.
apiVersion: v1
kind: Secret
metadata:
  name: burty-secret
  labels:
    app.kubernetes.io/name: burty-api
type: Opaque
stringData:
  # ── DB / Redis ────────────────────────────────────────────────────────────
  DB_HOST: "REPLACE-rds-endpoint"
  DB_USER: "burty"
  DB_PASSWORD: "REPLACE"
  REDIS_HOST: "REPLACE-elasticache-endpoint"
  REDIS_PASSWORD: "REPLACE"

  # ── 애플리케이션 시크릿 ────────────────────────────────────────────────────
  JWT_SECRET: "REPLACE-256bit-random"
  BURTY_SIGN_SECRET: "REPLACE-random"
  ADMIN_SETUP_KEY: "REPLACE-random"
  BURTY_FIELD_ENCRYPTION_KEY: "REPLACE-exactly-32-bytes-key-here"

  # ── 소셜 로그인 ───────────────────────────────────────────────────────────
  BURTY_SOCIAL_STUB_MODE: "false"
  BURTY_SOCIAL_KAKAO_CLIENT_ID: ""
  BURTY_SOCIAL_KAKAO_CLIENT_SECRET: ""
  BURTY_SOCIAL_GOOGLE_CLIENT_ID: ""
  BURTY_SOCIAL_GOOGLE_CLIENT_SECRET: ""
  BURTY_SOCIAL_NAVER_CLIENT_ID: ""
  BURTY_SOCIAL_NAVER_CLIENT_SECRET: ""

  # ── 외부 연동 ─────────────────────────────────────────────────────────────
  BURTY_YOUTH_CENTER_API_KEY: ""
  OPENAI_API_KEY: ""
  BURTY_AI_OPENAI_STUB_MODE: "false"

  # ── 메일 ──────────────────────────────────────────────────────────────────
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

  # ── 오픈뱅킹 ──────────────────────────────────────────────────────────────
  BURTY_EXTERNAL_OPEN_BANKING_CLIENT_ID: ""
  BURTY_EXTERNAL_OPEN_BANKING_CLIENT_SECRET: ""
