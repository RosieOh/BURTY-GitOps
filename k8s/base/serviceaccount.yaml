apiVersion: v1
kind: ServiceAccount
metadata:
  name: burty-api
  labels:
    app.kubernetes.io/name: burty-api
# 토큰 자동 마운트 불필요 — 앱은 K8s API 를 호출하지 않는다.
automountServiceAccountToken: false
# GHCR 패키지가 private 이면 이 시크릿 없이는 ImagePullBackOff 로 끝난다.
# 패키지를 public 으로 두더라도 rate limit 때문에 붙여 두는 편이 안전하다.
#
# 생성 (부트스트랩 1회 또는 ESO 로 관리):
#   kubectl -n burty-prod create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<read:packages 스코프 PAT>
imagePullSecrets:
  - name: ghcr-pull-secret
