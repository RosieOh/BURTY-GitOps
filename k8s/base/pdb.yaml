apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: burty-api
  labels:
    app.kubernetes.io/name: burty-api
spec:
  # 노드 드레인 중에도 최소 1대는 남긴다. replicas=1 인 환경(dev)에서는 드레인이 막히므로
  # dev overlay 에서 이 리소스를 제외한다.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: burty-api
