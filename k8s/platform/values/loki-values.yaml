# helm upgrade --install loki grafana/loki -n observability -f loki-values.yaml
#
# 기존 loki-config.yml(단일 컨테이너 + 로컬 볼륨) → SingleBinary + 오브젝트 스토리지.
# 로컬 PVC 를 유지해도 되지만, 파드가 재스케줄되면 로그가 사라진다.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: REPLACE-burty-loki-chunks
      ruler: REPLACE-burty-loki-ruler
    s3:
      region: ap-northeast-2
      # IRSA 사용 — accessKey/secretKey 를 values 에 두지 말 것.
  limits_config:
    retention_period: 720h   # 30d. 로그인 실패 로그 등 감사 목적이면 더 길게.
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

# SingleBinary 모드에서 불필요한 컴포넌트 비활성
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache:
  enabled: false
resultsCache:
  enabled: false
